name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  emulator:
    name: emulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: emulator
        run: cmake -B build -DPEDAL_BUILD_JUCE=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: emulator
        run: cmake --build build --config Release --parallel 4 --target dsp_tests emu PedalEmu_Standalone PedalEmu_VST3
      - name: DSP property tests
        working-directory: emulator
        shell: bash
        run: |
          if [ -x build/Release/dsp_tests.exe ]; then build/Release/dsp_tests.exe; else build/dsp_tests; fi
      - name: No dynamic MSVC runtime dependency (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/check_pe_imports.py emulator/build/juce/PedalEmu_artefacts/Release/VST3/PedalEmu.vst3/Contents/x86_64-win/PedalEmu.vst3 --list
          python tools/check_pe_imports.py emulator/build/juce/PedalEmu_artefacts/Release/Standalone/PedalEmu.exe
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: emulator/build/juce/PedalEmu_artefacts/Release
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          $args = "--strictness-level 8 --validate-in-process --timeout-ms 300000 --output-dir pluginval-logs --validate VST3/PedalEmu.vst3"
          $proc = Start-Process -FilePath "pluginval/pluginval.exe" -ArgumentList $args -Wait -PassThru -NoNewWindow -RedirectStandardOutput pluginval-stdout.txt
          Get-Content pluginval-stdout.txt | Select-Object -Last 40
          Copy-Item pluginval-stdout.txt pluginval-logs/
          if ($proc.ExitCode -ne 0) { Write-Error "pluginval failed with exit code $($proc.ExitCode)"; exit 1 }
          "pluginval exit code: $($proc.ExitCode)"
      - name: Run the standalone on the Windows desktop and screenshot it
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: emulator/build/juce/PedalEmu_artefacts/Release
        run: |
          $p = Start-Process -FilePath "Standalone/PedalEmu.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "PedalEmu.exe exited early with code $($p.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms; Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/pedalemu-windows-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "PedalEmu.exe alive after 12 s (pid $($p.Id)), window title: $($p.MainWindowTitle)" | Tee-Object -FilePath standalone-run.txt
          Stop-Process -Id $p.Id -Force
      - name: Upload Windows validation evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            emulator/build/juce/PedalEmu_artefacts/Release/pluginval-logs/**
            emulator/build/juce/PedalEmu_artefacts/Release/pedalemu-windows-desktop.png
            emulator/build/juce/PedalEmu_artefacts/Release/standalone-run.txt
            emulator/build/juce/PedalEmu_artefacts/Release/ziptest-pluginval.txt
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe (Inno Setup 6) not found on this runner"; exit 1 }
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}" -replace '^v',''
          $src = Resolve-Path emulator/build/juce/PedalEmu_artefacts/Release
          $repo = Resolve-Path .
          & $iscc.FullName "/DMyAppVersion=$ver" "/DSrcDir=$src" "/DRepoDir=$repo" `
              "/O$repo\emulator\build\juce\PedalEmu_artefacts\Release" installer\pedalemu.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          Get-ChildItem emulator/build/juce/PedalEmu_artefacts/Release/*setup.exe | ForEach-Object { "built: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: emulator/build/juce/PedalEmu_artefacts/Release
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse VST3/PedalEmu.vst3 dist/
          Copy-Item Standalone/PedalEmu.exe dist/
          Copy-Item *setup.exe dist/
          Copy-Item ../../../../../LICENSE dist/
          Copy-Item ../../../../assets/README.md dist/ASSETS-README.md
          Copy-Item ../../../../assets/FREEPATS-LICENSE-CC0.txt dist/
          Copy-Item ../../../../../docs/WINDOWS-INSTALL.md dist/README-FIRST.txt
          Compress-Archive -Path dist/* -DestinationPath PedalEmu-windows-x64.zip -Force
      - name: Verify the shipped zip extracts and the extracted plugin loads
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: emulator/build/juce/PedalEmu_artefacts/Release
        run: |
          # Extract exactly as a user would, into a fresh folder, and validate THAT copy -
          # this is what catches a package that "didn't extract properly".
          Remove-Item -Recurse -Force ziptest -ErrorAction SilentlyContinue
          Expand-Archive PedalEmu-windows-x64.zip -DestinationPath ziptest
          $dll = "ziptest/PedalEmu.vst3/Contents/x86_64-win/PedalEmu.vst3"
          foreach ($f in @($dll, "ziptest/PedalEmu.vst3/Contents/Resources/moduleinfo.json", "ziptest/README-FIRST.txt")) {
            if (-not (Test-Path $f)) { Write-Error "missing from the extracted package: $f"; exit 1 }
          }
          python ../../../../../tools/check_pe_imports.py $dll
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = "--strictness-level 8 --validate-in-process --timeout-ms 300000 --validate ziptest/PedalEmu.vst3"
          $pv = Start-Process -FilePath "pluginval/pluginval.exe" -ArgumentList $a -Wait -PassThru -NoNewWindow -RedirectStandardOutput ziptest-pluginval.txt
          Get-Content ziptest-pluginval.txt | Select-Object -Last 5
          if ($pv.ExitCode -ne 0) { Write-Error "the extracted copy failed pluginval ($($pv.ExitCode))"; exit 1 }
          "extracted package validated"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: emulator/build/juce/PedalEmu_artefacts/Release
        run: |
          mkdir -p dist && cp -R Standalone/PedalEmu.app VST3/PedalEmu.vst3 dist/ && cp ../../../../../LICENSE dist/
          ditto -c -k --keepParent dist PedalEmu-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PedalEmu-${{ runner.os }}
          path: |
            emulator/build/juce/PedalEmu_artefacts/Release/PedalEmu-*.zip
            emulator/build/juce/PedalEmu_artefacts/Release/*setup.exe

  release:
    needs: emulator
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/PedalEmu-*.zip
            artifacts/**/*setup.exe
          generate_release_notes: true
