; ESP32-C3 SuperMini: BLE-MIDI + WiFi AP web UI, bridged to the Daisy over UART as MIDI.
; UNVERIFIED: not built in this repo (no PlatformIO/ESP toolchain on the dev machine).
[env:esp32c3]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    max22-/ESP32-BLE-MIDI @ ^0.3.2
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.4
build_flags = -DCORE_DEBUG_LEVEL=1
